name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build without launching
        run: bash ./build.command --no-open
      - name: Verify app bundle
        run: |
          plutil -lint build/M5GPUBoost.app/Contents/Info.plist
          codesign --verify --deep --strict build/M5GPUBoost.app
      # The runtime checks need Metal 4, AC power and a qualifying external
      # display, so CI only confirms they still compile against the source.
      - name: Compile runtime checks
        run: bash Tests/run-runtime-checks.command --compile-only
      - name: Build Scroll Replay companion
        run: bash Tools/ScrollReplay/build.command --no-open
      - name: Verify Scroll Replay
        run: |
          plutil -lint build/ScrollReplay/ScrollReplay.app/Contents/Info.plist
          codesign --verify --strict build/ScrollReplay/ScrollReplay.app
          build/ScrollReplay/ScrollReplay.app/Contents/MacOS/ScrollReplay --self-test
